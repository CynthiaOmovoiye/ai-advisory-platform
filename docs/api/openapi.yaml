openapi: 3.1.0
info:
  title: AI Advisory Platform API
  version: 0.1.0
paths:
  /v1/assessments:
    get:
      tags:
      - Assessments
      summary: List Assessments
      operationId: list_assessments_v1_assessments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AssessmentOut'
                type: array
                title: Response List Assessments V1 Assessments Get
    post:
      tags:
      - Assessments
      summary: Create Assessment
      description: Start an assessment in the caller's org from a published template
        (Module 3).
      operationId: create_assessment_v1_assessments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}:
    get:
      tags:
      - Assessments
      summary: Get Assessment
      operationId: get_assessment_v1_assessments__assessment_id__get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/responses:
    put:
      tags:
      - Assessments
      summary: Save Responses
      operationId: save_responses_v1_assessments__assessment_id__responses_put
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveResponsesRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/complete:
    post:
      tags:
      - Assessments
      summary: Complete Assessment
      operationId: complete_assessment_v1_assessments__assessment_id__complete_post
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteAssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/recommendations:
    get:
      tags:
      - Assessments
      summary: List Recommendations
      operationId: list_recommendations_v1_assessments__assessment_id__recommendations_get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationOut'
                title: Response List Recommendations V1 Assessments  Assessment Id  Recommendations
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/signup:
    post:
      tags:
      - Auth
      summary: Signup
      operationId: signup_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/verify-email:
    post:
      tags:
      - Auth
      summary: Verify Email
      operationId: verify_email_v1_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProfileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/signin:
    post:
      tags:
      - Auth
      summary: Signin
      operationId: signin_v1_auth_signin_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigninResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/me:
    get:
      tags:
      - Auth
      summary: Me
      operationId: me_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProfileOut'
  /v1/auth/active-organization:
    patch:
      tags:
      - Auth
      summary: Active Organization
      operationId: active_organization_v1_auth_active_organization_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveOrganizationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProfileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/organizations:
    post:
      tags:
      - Organizations
      summary: Create Organization
      operationId: create_organization_v1_organizations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/members:
    get:
      tags:
      - Organizations
      summary: List Members
      operationId: list_members_v1_members_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemberOut'
                type: array
                title: Response List Members V1 Members Get
    post:
      tags:
      - Organizations
      summary: Invite Member
      operationId: invite_member_v1_members_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/members/{member_id}:
    delete:
      tags:
      - Organizations
      summary: Remove Member
      operationId: remove_member_v1_members__member_id__delete
      parameters:
      - name: member_id
        in: path
        required: true
        schema:
          type: string
          title: Member Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/recommendations/{recommendation_id}:
    patch:
      tags:
      - Recommendations
      summary: Patch Recommendation
      operationId: patch_recommendation_v1_recommendations__recommendation_id__patch
      parameters:
      - name: recommendation_id
        in: path
        required: true
        schema:
          type: string
          title: Recommendation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/report:
    post:
      tags:
      - Reports
      summary: Request Report
      operationId: request_report_v1_assessments__assessment_id__report_post
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Reports
      summary: Get Report
      operationId: get_report_v1_assessments__assessment_id__report_get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/metrics:
    get:
      tags:
      - Admin
      summary: Admin Metrics
      operationId: admin_metrics_v1_admin_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMetricsOut'
  /v1/evaluation/runs:
    get:
      tags:
      - Evaluation
      summary: List Runs
      operationId: list_runs_v1_evaluation_runs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EvaluationRunOut'
                type: array
                title: Response List Runs V1 Evaluation Runs Get
    post:
      tags:
      - Evaluation
      summary: Trigger Run
      operationId: trigger_run_v1_evaluation_runs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerEvaluationRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRunOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/templates:
    get:
      tags:
      - Templates
      summary: List Templates
      operationId: list_templates_v1_templates_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TemplateOut'
                type: array
                title: Response List Templates V1 Templates Get
    post:
      tags:
      - Templates
      summary: Create Template
      operationId: create_template_v1_templates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/templates/{template_id}:
    get:
      tags:
      - Templates
      summary: Get Template
      operationId: get_template_v1_templates__template_id__get
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/templates/{template_id}/publish:
    post:
      tags:
      - Templates
      summary: Publish Template
      operationId: publish_template_v1_templates__template_id__publish_post
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/documents:
    post:
      tags:
      - Documents
      summary: Upload Document
      operationId: upload_document_v1_assessments__assessment_id__documents_post
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_v1_assessments__assessment_id__documents_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Documents
      summary: List Documents
      operationId: list_documents_v1_assessments__assessment_id__documents_get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentOut'
                title: Response List Documents V1 Assessments  Assessment Id  Documents
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents/{document_id}/download:
    get:
      tags:
      - Documents
      summary: Download Document
      operationId: download_document_v1_documents__document_id__download_get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActiveOrganizationRequest:
      properties:
        organization_id:
          type: string
          minLength: 1
          title: Organization Id
      type: object
      required:
      - organization_id
      title: ActiveOrganizationRequest
    AdminMetricsOut:
      properties:
        organizations:
          type: integer
          title: Organizations
        assessments_total:
          type: integer
          title: Assessments Total
        assessments_by_status:
          additionalProperties:
            type: integer
          type: object
          title: Assessments By Status
        reports_published:
          type: integer
          title: Reports Published
        ai_usage:
          additionalProperties: true
          type: object
          title: Ai Usage
        evaluation:
          additionalProperties: true
          type: object
          title: Evaluation
      type: object
      required:
      - organizations
      - assessments_total
      - assessments_by_status
      - reports_published
      - ai_usage
      - evaluation
      title: AdminMetricsOut
    AssessmentDetailOut:
      properties:
        id:
          type: string
          title: Id
        template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Id
        template_name:
          type: string
          title: Template Name
        status:
          type: string
          title: Status
        sections:
          items:
            $ref: '#/components/schemas/SectionOut'
          type: array
          title: Sections
        responses:
          additionalProperties: true
          type: object
          title: Responses
      type: object
      required:
      - id
      - template_id
      - template_name
      - status
      - sections
      - responses
      title: AssessmentDetailOut
      description: "An assessment plus its template's questions and any saved responses\
        \ \u2014 everything\nthe answering UI needs to render and resume the form."
    AssessmentOut:
      properties:
        id:
          type: string
          title: Id
        template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Id
        template_name:
          type: string
          title: Template Name
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - template_id
      - template_name
      - status
      title: AssessmentOut
    AuthProfileOut:
      properties:
        id:
          type: string
          title: Id
        email:
          type: string
          title: Email
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        email_verified:
          type: boolean
          title: Email Verified
        status:
          type: string
          title: Status
        active_org:
          type: string
          title: Active Org
        global_roles:
          items:
            type: string
          type: array
          title: Global Roles
        org_roles:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Org Roles
        memberships:
          items:
            $ref: '#/components/schemas/MembershipOut'
          type: array
          title: Memberships
      type: object
      required:
      - id
      - email
      - name
      - email_verified
      - status
      - active_org
      - global_roles
      - org_roles
      - memberships
      title: AuthProfileOut
    Body_upload_document_v1_assessments__assessment_id__documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_document_v1_assessments__assessment_id__documents_post
    CompleteAssessmentResponse:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        status:
          type: string
          title: Status
        recommendations:
          items:
            $ref: '#/components/schemas/RecommendationOut'
          type: array
          title: Recommendations
      type: object
      required:
      - assessment_id
      - status
      - recommendations
      title: CompleteAssessmentResponse
    CreateAssessmentRequest:
      properties:
        template_id:
          type: string
          title: Template Id
      type: object
      required:
      - template_id
      title: CreateAssessmentRequest
    CreateOrganizationRequest:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        slug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
          title: Slug
      type: object
      required:
      - name
      - slug
      title: CreateOrganizationRequest
    CreateTemplateRequest:
      properties:
        category:
          type: string
          enum:
          - ai_readiness
          - data_maturity
          - security
          - governance
          - compliance
          - operations
          - infrastructure
          title: Category
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        sections:
          items:
            $ref: '#/components/schemas/SectionIn'
          type: array
          title: Sections
      type: object
      required:
      - category
      - title
      title: CreateTemplateRequest
    DocumentOut:
      properties:
        id:
          type: string
          title: Id
        original_filename:
          type: string
          title: Original Filename
        mime_type:
          type: string
          title: Mime Type
        byte_size:
          type: integer
          title: Byte Size
        scan_status:
          type: string
          title: Scan Status
      type: object
      required:
      - id
      - original_filename
      - mime_type
      - byte_size
      - scan_status
      title: DocumentOut
    DownloadResponse:
      properties:
        url:
          type: string
          title: Url
      type: object
      required:
      - url
      title: DownloadResponse
    EvaluationRunOut:
      properties:
        id:
          type: string
          title: Id
        dataset_name:
          type: string
          title: Dataset Name
        ruleset_name:
          type: string
          title: Ruleset Name
        model_id:
          type: string
          title: Model Id
        status:
          type: string
          title: Status
        accuracy:
          type: number
          title: Accuracy
        consistency:
          type: number
          title: Consistency
        completeness:
          type: number
          title: Completeness
        hallucination_rate:
          type: number
          title: Hallucination Rate
        item_count:
          type: integer
          title: Item Count
      type: object
      required:
      - id
      - dataset_name
      - ruleset_name
      - model_id
      - status
      - accuracy
      - consistency
      - completeness
      - hallucination_rate
      - item_count
      title: EvaluationRunOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InviteMemberRequest:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
        role:
          type: string
          enum:
          - org_user
          - consultant
          title: Role
          default: org_user
      type: object
      required:
      - email
      title: InviteMemberRequest
    InviteMemberResponse:
      properties:
        member:
          $ref: '#/components/schemas/MemberOut'
        invite_token:
          type: string
          title: Invite Token
      type: object
      required:
      - member
      - invite_token
      title: InviteMemberResponse
    MemberOut:
      properties:
        id:
          type: string
          title: Id
        invited_email:
          type: string
          title: Invited Email
        role:
          type: string
          title: Role
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - invited_email
      - role
      - status
      title: MemberOut
    MembershipOut:
      properties:
        organization_id:
          type: string
          title: Organization Id
        organization_name:
          type: string
          title: Organization Name
        organization_slug:
          type: string
          title: Organization Slug
        role:
          type: string
          title: Role
      type: object
      required:
      - organization_id
      - organization_name
      - organization_slug
      - role
      title: MembershipOut
    OrganizationOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
      type: object
      required:
      - id
      - name
      - slug
      title: OrganizationOut
    Provenance:
      properties:
        source:
          type: string
          enum:
          - llm
          - fallback
          title: Source
        grounding_passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Grounding Passed
      type: object
      required:
      - source
      - grounding_passed
      title: Provenance
    QuestionIn:
      properties:
        key:
          type: string
          pattern: ^[a-z0-9_]{1,60}$
          title: Key
        prompt:
          type: string
          minLength: 1
          title: Prompt
        type:
          type: string
          enum:
          - text
          - long_text
          - number
          - single_select
          - multi_select
          - file_upload
          title: Type
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
      - key
      - prompt
      - type
      title: QuestionIn
    QuestionOut:
      properties:
        id:
          type: string
          title: Id
        key:
          type: string
          title: Key
        prompt:
          type: string
          title: Prompt
        type:
          type: string
          title: Type
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
      - id
      - key
      - prompt
      - type
      - config
      title: QuestionOut
    RecommendationOut:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        rule_code:
          type: string
          title: Rule Code
        category:
          type: string
          title: Category
        severity:
          type: string
          title: Severity
        title:
          type: string
          title: Title
        finding:
          type: string
          title: Finding
        rationale:
          type: string
          title: Rationale
        remediation:
          type: string
          title: Remediation
        status:
          type: string
          title: Status
        provenance:
          $ref: '#/components/schemas/Provenance'
      type: object
      required:
      - id
      - rule_code
      - category
      - severity
      - title
      - finding
      - rationale
      - remediation
      - status
      - provenance
      title: RecommendationOut
    RecommendationPatch:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        finding:
          anyOf:
          - type: string
          - type: 'null'
          title: Finding
        rationale:
          anyOf:
          - type: string
          - type: 'null'
          title: Rationale
        remediation:
          anyOf:
          - type: string
          - type: 'null'
          title: Remediation
        status:
          anyOf:
          - type: string
            enum:
            - approved
            - rejected
          - type: 'null'
          title: Status
      type: object
      title: RecommendationPatch
      description: 'Consultant edit + review action. Narrative fields are editable;
        status moves the

        review forward. Deterministic provenance (rule, severity, source) is NOT editable.'
    ReportOut:
      properties:
        id:
          type: string
          title: Id
        assessment_id:
          type: string
          title: Assessment Id
        title:
          type: string
          title: Title
        status:
          type: string
          title: Status
        pdf_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Pdf Url
      type: object
      required:
      - id
      - assessment_id
      - title
      - status
      - pdf_url
      title: ReportOut
    ResponseInput:
      properties:
        key:
          type: string
          title: Key
        value:
          title: Value
      type: object
      required:
      - key
      - value
      title: ResponseInput
    SaveResponsesRequest:
      properties:
        responses:
          items:
            $ref: '#/components/schemas/ResponseInput'
          type: array
          title: Responses
      type: object
      required:
      - responses
      title: SaveResponsesRequest
    SectionIn:
      properties:
        title:
          type: string
          minLength: 1
          title: Title
        questions:
          items:
            $ref: '#/components/schemas/QuestionIn'
          type: array
          title: Questions
      type: object
      required:
      - title
      title: SectionIn
    SectionOut:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        questions:
          items:
            $ref: '#/components/schemas/QuestionOut'
          type: array
          title: Questions
      type: object
      required:
      - id
      - title
      - questions
      title: SectionOut
    SigninRequest:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - email
      - password
      title: SigninRequest
    SigninResponse:
      properties:
        user:
          $ref: '#/components/schemas/AuthProfileOut'
      type: object
      required:
      - user
      title: SigninResponse
    SignupRequest:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
        password:
          type: string
          maxLength: 256
          minLength: 12
          title: Password
        name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Name
        organization_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Organization Name
      type: object
      required:
      - email
      - password
      - organization_name
      title: SignupRequest
    SignupResponse:
      properties:
        user:
          $ref: '#/components/schemas/AuthProfileOut'
        verification_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Token
      type: object
      required:
      - user
      title: SignupResponse
    TemplateOut:
      properties:
        id:
          type: string
          title: Id
        category:
          type: string
          title: Category
        title:
          type: string
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        version:
          type: integer
          title: Version
        status:
          type: string
          title: Status
        sections:
          items:
            $ref: '#/components/schemas/SectionOut'
          type: array
          title: Sections
      type: object
      required:
      - id
      - category
      - title
      - description
      - version
      - status
      - sections
      title: TemplateOut
    TriggerEvaluationRequest:
      properties:
        dataset_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Name
          default: baseline-readiness
      type: object
      title: TriggerEvaluationRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyEmailRequest:
      properties:
        token:
          type: string
          maxLength: 512
          minLength: 20
          title: Token
      type: object
      required:
      - token
      title: VerifyEmailRequest
