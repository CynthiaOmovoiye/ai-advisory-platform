[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only `app` is the importable package; tests/migrations/scripts/data are run in place
# (pytest adds the repo root to the path — see [tool.pytest.ini_options].pythonpath).
[tool.setuptools]
packages = ["app"]

[project]
name = "ai-advisory-platform-backend"
version = "0.1.0"
description = "AI Advisory Platform — backend (FastAPI). This slice ships the pure-domain rule engine, grounding check, LLM provider interface, and evaluation framework."
requires-python = ">=3.12"
# The domain core (rules engine, grounding, eval, access kernel) is pure-stdlib and
# runs/tests with ZERO of these (ADR-0002 — the domain layer has no I/O). The app
# (API + persistence + OpenRouter client) needs them:
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",      # password hashing for credentials auth
    "httpx>=0.27",            # OpenRouter client
    "pyjwt>=2.8",             # BFF session-token verification (ADR-0009)
    "python-multipart>=0.0.9",  # file uploads
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]
# Worker tier — Celery + Redis + Playwright for report rendering + boto3 for S3/MinIO:
worker = ["celery>=5.4", "redis>=5.0", "playwright>=1.40", "boto3>=1.34"]
# Postgres driver for running against a real database (tests use SQLite):
postgres = ["psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
pythonpath = ["."]          # so `from app...` / `from tests...` resolve
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]   # incl. bugbear + bandit security lints
ignore = [
    "S101",   # asserts are fine (tests, and our internal invariants)
    "B008",   # function-call-in-default — this IS the FastAPI Depends() idiom
    "UP042",  # `class X(str, Enum)` is intentional (JSON-serializable role/severity)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]   # hard-coded test secrets/tokens are expected in tests

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
# Pragmatic config: type-check function bodies for real type errors, but don't force
# annotations on FastAPI route glue (where Depends()-style signatures are idiomatically
# light). The pure core (domain/services/llm/eval) is held to a stricter bar below.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
exclude = ['^migrations/', '^tests/', '^scripts/', '\.venv']

[[tool.mypy.overrides]]
# The business/AI logic — the part correctness matters most — must be fully typed.
module = ["app.domain.*", "app.services.*", "app.llm.*", "app.eval.*"]
disallow_untyped_defs = true
