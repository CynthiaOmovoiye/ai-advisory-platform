name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests
        # The whole suite is hermetic: httpx MockTransport, SQLite, FastAPI TestClient,
        # and a fake PDF renderer — no network, no database, no API key.
        run: pytest -q

      - name: Migrations apply + ORM drift check
        run: |
          DATABASE_URL="sqlite+pysqlite:///./ci.db" python -m alembic upgrade head
          DATABASE_URL="sqlite+pysqlite:///./ci.db" python scripts/check_migrations.py

  frontend:
    name: Frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (typecheck + lint via next build)
        # next build runs the TypeScript typecheck and ESLint as part of the build.
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/v1
